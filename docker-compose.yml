services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dayflow
    ports:
      - "5432:5432"
    volumes:
      - dayflow_pgdata:/var/lib/postgresql/data
      - ./server/migrations:/docker-entrypoint-initdb.d

volumes:
  dayflow_pgdata:
